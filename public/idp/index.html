<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDP — Kelola</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="design-system/styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--surface-sunken);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      text-align: center;
    }
    .logo {
      font-family: var(--font-title);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      font-family: var(--font-title);
      font-size: 28px;
      font-weight: 800;
      color: var(--text-heading);
      line-height: 1.2;
    }
    p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 280px;
      line-height: 1.6;
    }
    .btn-open {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: white;
      font-family: var(--font-title);
      font-size: 14px;
      font-weight: 700;
      padding: 0 28px;
      height: 44px;
      border-radius: var(--radius-pill);
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .btn-open:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Kelola — IDP</div>
    <h1>Individual Development<br>Plan</h1>
    <p>Platform pemantauan dan pengelolaan rencana pengembangan karyawan.</p>
    <a class="btn-open" href="monitoring-admin.html">
      Open
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </div>
</body>
</html>
