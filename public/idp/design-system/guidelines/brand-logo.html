<!-- @dsCard group="Brand" viewport="700x230" name="Logo & Lockup" subtitle="Kelola symbol + product name (Avenir) · Talentlytica vendor wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); padding: 18px; font-family: var(--font-body); }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .lab { font-family: var(--font-body); font-size:9px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color: var(--text-faint); margin-bottom: 8px; }
  .col { display:flex; flex-direction:column; }
  .card { border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 20px 24px; display:flex; align-items:center; gap: 16px; min-height: 64px; }
  .on-light { background:#fff; }
  .on-brand { background: var(--gradient-primary); }
  .mark { height: 50px; width:auto; flex-shrink:0; }
  .wordmark-name { font-family: var(--font-title); font-weight: 900; font-size: 34px; color: var(--primary-5); line-height: 1; letter-spacing: -0.01em; }
  .wordmark-name.knock { color:#fff; }
  .vendor { height: 26px; width:auto; }
  .vrow { display:flex; align-items:center; gap:10px; }
  .by { font-family: var(--font-body); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="grid">
    <div class="col">
      <span class="lab">Primary lockup · on light</span>
      <div class="card on-light">
        <img class="mark" src="../assets/logo-kelola-mark.svg" alt="Kelola symbol" />
        <span class="wordmark-name">Kelola</span>
      </div>
    </div>
    <div class="col">
      <span class="lab">Reversed · on brand gradient</span>
      <div class="card on-brand">
        <img class="mark" src="../assets/logo-kelola-mark.svg" alt="Kelola symbol" style="filter: brightness(0) invert(1);" />
        <span class="wordmark-name knock">Kelola</span>
      </div>
    </div>
    <div class="col">
      <span class="lab">Symbol only</span>
      <div class="card on-light" style="justify-content:center">
        <img class="mark" src="../assets/logo-kelola-mark.svg" alt="Kelola symbol" style="height:60px" />
      </div>
    </div>
    <div class="col">
      <span class="lab">Vendor wordmark · Talentlytica</span>
      <div class="card on-light">
        <div class="vrow">
          <img class="vendor" src="../assets/logo-talentlytica-wordmark.svg" alt="Talentlytica" />
        </div>
      </div>
    </div>
  </div>
</body>
</html>
