<!-- @dsCard group="Brand" viewport="700x210" name="Signature Motifs" subtitle="Carved active-nav notch · 8/0/8/0 tag · brand illustration style" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); padding: 18px; font-family: var(--font-body); }
  .grid { display:grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 14px; align-items:stretch; }
  .lab { font-family: var(--font-body); font-size:9px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color: var(--text-faint); margin-bottom: 8px; }
  .col { display:flex; flex-direction:column; }

  /* nav notch demo */
  .nav { background: var(--gradient-primary); border-radius: var(--radius-md); padding: 14px 0 14px 14px; flex:1; }
  .navitem { color:#fff; font-family: var(--font-title); font-weight:700; font-size:12px; padding: 8px 12px; display:flex; align-items:center; gap:8px; }
  .navitem .ic { width:14px; height:14px; border:2px solid currentColor; border-radius:3px; }
  .navitem.active { position:relative; background: var(--background); color: var(--primary-5); border-radius: 18px 0 0 18px; margin-left: 10px; }
  .navitem.active::after { content:""; position:absolute; background:transparent; bottom:100%; right:0; height:18px; width:18px; border-bottom-right-radius:14px; box-shadow: 0 10px 0 0 var(--background); }
  .navitem.active::before { content:""; position:absolute; background:transparent; top:100%; right:0; height:18px; width:18px; border-top-right-radius:14px; box-shadow: 0 -10px 0 0 var(--background); }

  /* tag motif */
  .tagcard { background:#fff; border-radius: var(--radius-md); box-shadow: var(--shadow-card); flex:1; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
  .beta { background: var(--gradient-primary); color:#fff; font-family: var(--font-body); font-weight:700; font-size:11px; padding: 3px 10px; border-radius: var(--radius-notch); }
  .pill { background: var(--primary-1); color: var(--primary-6); font-family: var(--font-body); font-weight:700; font-size:11px; padding: 3px 12px; border-radius: var(--radius-pill); }

  .ilu { background:#fff; border-radius: var(--radius-md); box-shadow: var(--shadow-card); flex:1; display:flex; align-items:center; justify-content:center; }
  .ilu img { height: 84px; width:auto; }
</style>
</head>
<body>
  <div class="grid">
    <div class="col">
      <span class="lab">Active nav · carved notch</span>
      <div class="nav">
        <div class="navitem"><span class="ic"></span>Home</div>
        <div class="navitem active"><span class="ic"></span>Assignment</div>
        <div class="navitem"><span class="ic"></span>Organization</div>
      </div>
    </div>
    <div class="col">
      <span class="lab">Tag &amp; pill motifs</span>
      <div class="tagcard">
        <span class="beta">BETA</span>
        <span class="pill">Participant</span>
      </div>
    </div>
    <div class="col">
      <span class="lab">Illustration</span>
      <div class="ilu"><img src="../assets/team-type-strategic.svg" alt="Team type illustration" /></div>
    </div>
  </div>
</body>
</html>
