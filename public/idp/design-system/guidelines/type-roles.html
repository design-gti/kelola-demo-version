<!-- @dsCard group="Type" viewport="700x230" name="UI & Body Roles" subtitle="Title/Subtitle (Avenir) · Paragraph/Body/Label/Caption (Open Sans)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); padding: 22px; }
  .card { background:#fff; border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 18px 24px; }
  .spec { display:flex; align-items:baseline; gap:14px; padding: 6px 0; border-bottom: 1px solid var(--neutral-2); }
  .spec:last-child { border-bottom: none; }
  .tag { font-family: var(--font-body); font-size: 9px; color: var(--text-faint); width: 150px; flex-shrink:0; }
  .title { font-family: var(--font-title); font-size: var(--type-title-size); font-weight: var(--type-title-weight); color: var(--text-body); }
  .subtitle { font-family: var(--font-title); font-size: var(--type-subtitle-size); font-weight: var(--type-subtitle-weight); color: var(--text-body); }
  .para { font-family: var(--font-body); font-size: var(--type-paragraph-size); font-weight: var(--type-paragraph-weight); color: var(--text-body); }
  .bdy { font-family: var(--font-body); font-size: var(--type-body-size); font-weight: var(--type-body-weight); color: var(--text-muted); }
  .lbl { font-family: var(--font-body); font-size: var(--type-label-size); font-weight: var(--type-label-weight); color: var(--text-body); text-transform: uppercase; letter-spacing:.04em; }
  .cap { font-family: var(--font-body); font-size: var(--type-caption-size); font-weight: var(--type-caption-weight); color: var(--text-faint); }
</style>
</head>
<body>
  <div class="card">
    <div class="spec"><span class="tag">Title · 14 / 700 · Avenir</span><span class="title">Create Batch</span></div>
    <div class="spec"><span class="tag">Subtitle · 12 / 700 · Avenir</span><span class="subtitle">Email address</span></div>
    <div class="spec"><span class="tag">Paragraph · 14 / 400</span><span class="para">Pantau pencapaian dan kompetensi karyawan secara efektif.</span></div>
    <div class="spec"><span class="tag">Body · 12 / 400</span><span class="bdy">Terjadi kesalahan saat menampilkan data. Muat ulang halaman.</span></div>
    <div class="spec"><span class="tag">Label · 10 / 700</span><span class="lbl">Participant</span></div>
    <div class="spec"><span class="tag">Caption · 10 / 400</span><span class="cap">Updated 2 hours ago</span></div>
  </div>
</body>
</html>
