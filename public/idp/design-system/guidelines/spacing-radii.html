<!-- @dsCard group="Spacing" viewport="700x180" name="Radii" subtitle="8px is the workhorse · pills for buttons · the 8/0/8/0 notch motif" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); padding: 18px; font-family: var(--font-body); }
  .row { display:flex; gap: 14px; align-items:flex-end; }
  .item { text-align:center; }
  .box { width: 84px; height: 70px; background:#fff; box-shadow: var(--shadow-card); border: 1px solid var(--border); }
  .lab { font-family: var(--font-title); font-weight:700; font-size: 11px; color: var(--text-body); margin-top: 8px; }
  .val { font-size: 9px; color: var(--text-muted); }
  .brand { background: var(--gradient-primary); border:none; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab">sm</div><div class="val">4px · inputs</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab">md</div><div class="val">8px · cards</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab">lg</div><div class="val">16px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab">xl</div><div class="val">18px · nav</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="lab">pill</div><div class="val">999px · buttons</div></div>
    <div class="item"><div class="box brand" style="border-radius:var(--radius-notch)"></div><div class="lab">notch</div><div class="val">8 / 0 / 8 / 0</div></div>
  </div>
</body>
</html>
