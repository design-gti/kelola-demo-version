<!-- @dsCard group="Components" viewport="700x420" name="Sidebar Navigation" subtitle="Brand-gradient rail with the carved-notch active state" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" />
<style>
  body { margin: 0; background: var(--background); font-family: var(--font-body); }
  .frame { display: flex; min-height: 420px; }
  .content { flex: 1; padding: 24px; }
  .logo-name { font-family: var(--font-title); font-weight: 900; font-size: 20px; color: var(--primary-5); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Sidebar, NavItem, Badge } = window.KelolaDesignSystem_59e7aa;
  const items = [
    { id:'home', icon:'ti-home', label:'Home' },
    { id:'assignment', icon:'ti-clipboard-list', label:'Assignment' },
    { id:'development', icon:'ti-certificate', label:'Development' },
    { id:'organization', icon:'ti-building', label:'Organization' },
    { id:'teams', icon:'ti-users-group', label:'Teams' },
  ];
  function Demo() {
    const [active, setActive] = React.useState('assignment');
    return (
      <div className="frame">
        <Sidebar logo={<>
          <img src="../../assets/logo-kelola-mark.svg" height="28" alt="" />
          <span className="logo-name">Kelola</span>
        </>}>
          {items.map((it) => (
            <NavItem key={it.id} active={active===it.id} onClick={()=>setActive(it.id)}
              icon={<i className={'ti '+it.icon} />} label={it.label}
              badge={it.id==='development' ? <Badge gradient notch>BETA</Badge> : null} />
          ))}
        </Sidebar>
        <div className="content">
          <div style={{fontFamily:'var(--font-title)',fontWeight:800,fontSize:20,color:'var(--text-strong)'}}>
            {items.find(i=>i.id===active).label}
          </div>
          <p style={{fontFamily:'var(--font-body)',fontSize:13,color:'var(--text-muted)',maxWidth:340}}>
            Click an item — the active row carves a concave notch into the gradient rail.
          </p>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
