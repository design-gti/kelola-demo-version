<!-- @dsCard group="Kelola App" viewport="1180x720" name="Kelola Web App" subtitle="Login → dashboard → employees → 9-box mapping (interactive)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kelola — Talent Management</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--background); font-family: var(--font-body); color: var(--text-body); }
  * { box-sizing: border-box; }
  #root { height: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="kit-ui.jsx" data-presets="react"></script>
<script type="text/babel" src="shell.jsx" data-presets="react"></script>
<script type="text/babel" src="screens.jsx" data-presets="react"></script>
<script type="text/babel" data-presets="react">
  function App() {
    const [authed, setAuthed] = React.useState(false);
    const [active, setActive] = React.useState('home');

    const titles = { home: 'Dashboard', employees: 'Employee List', mapping: 'Box Mapping', assignment: 'Assignment', development: 'Development', organization: 'Organization', teams: 'Teams' };

    if (!authed) return <LoginScreen onLogin={() => { setAuthed(true); setActive('home'); }} />;

    let content;
    if (active === 'home') content = <DashboardScreen />;
    else if (active === 'employees') content = <EmployeeListScreen onOpenMapping={() => setActive('mapping')} />;
    else if (active === 'mapping') content = <TalentMappingScreen />;
    else content = <Placeholder label={titles[active]} />;

    return (
      <div style={{ display: 'flex', height: '100%', overflow: 'hidden' }}>
        <Sidebar active={active} onNavigate={setActive} />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
          <Header title={titles[active] || 'Kelola'} onLogout={() => setAuthed(false)} />
          <main style={{ flex: 1, overflowY: 'auto', padding: 24 }}>{content}</main>
        </div>
      </div>
    );
  }

  function Placeholder({ label }) {
    return (
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 14, color: 'var(--text-muted)' }}>
        <img src="../../assets/illustration-wip.svg" height="140" alt="" style={{ opacity: .9 }} />
        <div style={{ fontFamily: 'var(--font-title)', fontWeight: 800, fontSize: 18, color: 'var(--text-body)' }}>{label}</div>
        <div style={{ fontFamily: 'var(--font-body)', fontSize: 13 }}>Halaman ini belum termasuk dalam UI kit ini.</div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
