<!-- @dsCard group="Colors" viewport="700x150" name="Neutral · Greys" subtitle="UI structure · brand black = 7 (#495057) · canvas #F7F7F7" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--background); padding: 18px; }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); border: 1px solid var(--border); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; box-sizing: border-box; }
  .sw .n { font-family: var(--font-title); font-weight: 800; font-size: 12px; }
  .sw .h { font-family: var(--font-body); font-size: 9px; opacity: .85; }
  .light { color: var(--neutral-8); }
  .dark { color: #fff; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw light" style="background:var(--neutral-0)"><span class="n">0</span><span class="h">#FFFFFF</span></div>
    <div class="sw light" style="background:var(--neutral-1)"><span class="n">1</span><span class="h">#F8F9FA</span></div>
    <div class="sw light" style="background:var(--neutral-2)"><span class="n">2</span><span class="h">#E9ECEF</span></div>
    <div class="sw light" style="background:var(--neutral-3)"><span class="n">3</span><span class="h">#DEE2E6</span></div>
    <div class="sw light" style="background:var(--neutral-4)"><span class="n">4</span><span class="h">#CED4DA</span></div>
    <div class="sw light" style="background:var(--neutral-5)"><span class="n">5</span><span class="h">#ADB5BD</span></div>
    <div class="sw dark" style="background:var(--neutral-6)"><span class="n">6</span><span class="h">#868E96</span></div>
    <div class="sw dark" style="background:var(--neutral-7)"><span class="n">7</span><span class="h">#495057</span></div>
    <div class="sw dark" style="background:var(--neutral-8)"><span class="n">8</span><span class="h">#343A40</span></div>
    <div class="sw dark" style="background:var(--neutral-9)"><span class="n">9</span><span class="h">#212529</span></div>
  </div>
</body>
</html>
