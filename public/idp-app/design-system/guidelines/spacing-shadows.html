<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows" subtitle="Soft & slightly offset — never harsh. Card shadow is the signature." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); padding: 24px; font-family: var(--font-body); }
  .row { display:flex; gap: 28px; }
  .item { text-align:center; flex:1; }
  .box { height: 78px; background:#fff; border-radius: var(--radius-md); }
  .lab { font-family: var(--font-title); font-weight:700; font-size: 11px; color: var(--text-body); margin-top: 14px; }
  .val { font-size: 9px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-card)"></div><div class="lab">shadow-card</div><div class="val">2 4 20 / .07</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lab">shadow-sm</div><div class="val">2 2 15 / .10</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab">shadow-lg</div><div class="val">0 0 24 / .16</div></div>
  </div>
</body>
</html>
