<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces, Text & Gradient" subtitle="Canvas, card, text roles, and the single brand gradient" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--background); padding: 18px; }
  .wrap { display:grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 12px; }
  .panel { border-radius: var(--radius-md); padding: 12px; box-sizing:border-box; }
  .label { font-family: var(--font-body); font-size:9px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; opacity:.7; margin-bottom:6px; }
  /* surfaces */
  .surfaces { background:#fff; box-shadow: var(--shadow-card); display:flex; flex-direction:column; gap:6px; }
  .chip { display:flex; align-items:center; gap:8px; font-size:10px; color:var(--text-body); }
  .dot { width:18px; height:18px; border-radius:5px; border:1px solid var(--border); }
  /* text */
  .texts { background:#fff; box-shadow: var(--shadow-card); }
  .texts p { margin:0 0 4px; font-family: var(--font-title); }
  .t-strong { color: var(--text-strong); font-weight:800; font-size:15px; }
  .t-body { color: var(--text-body); font-weight:500; font-size:13px; }
  .t-muted { color: var(--text-muted); font-size:12px; }
  .t-faint { color: var(--text-faint); font-size:12px; }
  .t-link { color: var(--text-link); font-size:12px; font-weight:700; }
  /* gradient */
  .grad { background: var(--gradient-primary); color:#fff; display:flex; flex-direction:column; justify-content:flex-end; box-shadow: var(--shadow-card); }
  .grad .g { font-family: var(--font-title); font-weight:800; font-size:13px; }
  .grad .gh { font-family: var(--font-body); font-size:9px; opacity:.9; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel surfaces">
      <div class="label">Surfaces</div>
      <div class="chip"><span class="dot" style="background:var(--background)"></span>background · #F7F7F7</div>
      <div class="chip"><span class="dot" style="background:var(--surface-card)"></span>surface-card · #FFF</div>
      <div class="chip"><span class="dot" style="background:var(--surface-sunken)"></span>surface-sunken · neutral-1</div>
      <div class="chip"><span class="dot" style="background:var(--surface-brand-soft)"></span>brand-soft · primary-1</div>
    </div>
    <div class="panel texts">
      <div class="label">Text roles</div>
      <p class="t-strong">Strong heading</p>
      <p class="t-body">Body text · neutral-7</p>
      <p class="t-muted">Muted · neutral-6</p>
      <p class="t-faint">Faint / disabled</p>
      <p class="t-link">Link · primary-5</p>
    </div>
    <div class="panel grad">
      <div class="g">Brand gradient</div>
      <div class="gh">185.52° · #2F95DE → #016699</div>
    </div>
  </div>
</body>
</html>
