<!-- @dsCard group="Type" viewport="700x190" name="Typeface Families" subtitle="Avenir (UI / titles) + Open Sans (body)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--background); padding: 18px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { background:#fff; border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 16px 18px; }
  .name { font-family: var(--font-title); font-weight: 900; font-size: 30px; color: var(--primary-5); line-height:1; }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .alpha { font-size: 18px; color: var(--text-body); margin-top: 12px; }
  .av { font-family: var(--font-title); }
  .os { font-family: var(--font-body); }
  .role { font-family: var(--font-body); font-size: 10px; color: var(--text-faint); margin-top: 10px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="name av">Avenir</div>
      <div class="meta">Geometric sans · weights 300–900</div>
      <div class="alpha av">AaBbCcGgKkRr · 1234567890</div>
      <div class="role">Headings · titles · buttons · nav · labels · badges</div>
    </div>
    <div class="card">
      <div class="name os">Open Sans</div>
      <div class="meta">Humanist sans · Google Fonts · 300–800</div>
      <div class="alpha os">AaBbCcGgKkRr · 1234567890</div>
      <div class="role">Paragraphs · body · captions · table data · inputs</div>
    </div>
  </div>
</body>
</html>
