<!-- @dsCard group="Colors" viewport="700x150" name="Secondary · Orange" subtitle="Accent orange scale 0–9 · DEFAULT = 5 (#FD9F28)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--background); padding: 18px; }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; box-sizing: border-box; }
  .sw .n { font-family: var(--font-title); font-weight: 800; font-size: 12px; }
  .sw .h { font-family: var(--font-body); font-size: 9px; opacity: .85; }
  .light { color: var(--secondary-9); }
  .dark { color: #fff; }
  .tag { display:inline-block; font-family: var(--font-body); font-size: 8px; font-weight:700; background:#fff; color:var(--secondary-7); border-radius: var(--radius-pill); padding: 1px 6px; margin-top:3px; width:fit-content; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw light" style="background:var(--secondary-0)"><span class="n">0</span><span class="h">#FFF2E4</span></div>
    <div class="sw light" style="background:var(--secondary-1)"><span class="n">1</span><span class="h">#FFE3C5</span></div>
    <div class="sw light" style="background:var(--secondary-2)"><span class="n">2</span><span class="h">#FFD399</span></div>
    <div class="sw light" style="background:var(--secondary-3)"><span class="n">3</span><span class="h">#FFBB65</span></div>
    <div class="sw light" style="background:var(--secondary-4)"><span class="n">4</span><span class="h">#FDA637</span></div>
    <div class="sw light" style="background:var(--secondary-5)"><span class="n">5</span><span class="h">#FD9F28</span><span class="tag">DEFAULT</span></div>
    <div class="sw dark" style="background:var(--secondary-6)"><span class="n">6</span><span class="h">#F28700</span></div>
    <div class="sw dark" style="background:var(--secondary-7)"><span class="n">7</span><span class="h">#E27E00</span></div>
    <div class="sw dark" style="background:var(--secondary-8)"><span class="n">8</span><span class="h">#CA6F00</span></div>
    <div class="sw dark" style="background:var(--secondary-9)"><span class="n">9</span><span class="h">#854800</span></div>
  </div>
</body>
</html>
