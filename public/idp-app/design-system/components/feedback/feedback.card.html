<!-- @dsCard group="Components" viewport="700x300" name="Badges & Alerts" subtitle="Status pills, BETA tag, and inline alert boxes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css" />
<style>
  body { margin: 0; background: var(--background); padding: 22px; font-family: var(--font-body); }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lab { font-family: var(--font-body); font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-faint); width: 100%; }
  .alerts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Badge, Alert } = window.KelolaDesignSystem_59e7aa;
  function Demo() {
    return (
      <div className="stack">
        <div className="row">
          <span className="lab">Status &amp; tags</span>
          <Badge color="success" leftDot>Active</Badge>
          <Badge color="warning" leftDot>On Leave</Badge>
          <Badge color="error" leftDot>Resigned</Badge>
          <Badge color="primary">Participant</Badge>
          <Badge variant="filled" color="secondary">12 New</Badge>
          <Badge variant="outline" color="primary">Draft</Badge>
          <Badge gradient notch>BETA</Badge>
        </div>
        <div className="alerts">
          <span className="lab">Alerts</span>
          <Alert type="error">Email atau password salah.</Alert>
          <Alert type="success">Log in berhasil.</Alert>
          <Alert type="warning" title="Session Limit Reached" onClose={()=>{}}>Akun ini sudah login di 3 perangkat.</Alert>
          <Alert type="info">Data dimuat ulang setiap 24 jam.</Alert>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
