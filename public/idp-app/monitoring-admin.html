<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring IDP - Talentlytica</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="design-system/styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font-body);
      background: var(--surface-sunken);
      padding: 24px;
      transition: padding-right 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    body.panel-open {
      padding-right: 436px;
    }

    .page-wrapper {
      max-width: 1158px;
      margin: 0 auto;
    }
    
    /* ═══════════════ HEADER BUTTONS ═══════════════ */
    .header-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .header-actions-title {
      font-family: var(--font-title);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-title);
    }
    .header-actions-buttons {
      display: flex;
      gap: 8px;
    }
    
    .btn {
      font-family: var(--font-title);
      font-size: 14px;
      padding: 8px 16px;
      height: 35px;
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      transition: all var(--duration-base);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-outline {
      background: white;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    
    .btn-outline:hover {
      background: var(--surface-sunken);
    }

    .btn-badge {
      background: var(--primary);
      color: white;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 800px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .btn-filled {
      background: var(--primary);
      color: white;
    }
    
    .btn-filled:hover {
      background: var(--primary-6);
    }

    .btn-bell {
      width: 35px;
      height: 35px;
      padding: 0;
      border-radius: var(--radius-pill);
      background: white;
      border: 1px solid var(--border);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background var(--duration-base), color var(--duration-base);
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .btn-bell:hover {
      background: var(--surface-sunken);
      color: var(--text-body);
    }
    .btn-bell .notif-dot {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 7px;
      height: 7px;
      background: #e53e3e;
      border-radius: 50%;
      border: 1.5px solid white;
      pointer-events: none;
    }

    /* ═══════════════ INSIGHT CARD ═══════════════ */
    .insight-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .insight-stat-label {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .insight-stat-value {
      font-family: var(--font-title);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-body);
      white-space: nowrap;
    }
    .insight-sep {
      width: 1px;
      height: 16px;
      background: var(--border);
      flex-shrink: 0;
    }
    .insight-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .insight-chips .status-chip { cursor: pointer; user-select: none; border: 1px solid rgba(0,0,0,0.10); box-shadow: 0 1px 1px rgba(0,0,0,0.04); transition: transform 0.12s, box-shadow 0.12s, filter 0.12s; }
    .insight-chips .status-chip:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.14); filter: brightness(0.97); }
    .insight-chips .status-chip.chip-insight-active { outline: 2px solid currentColor; outline-offset: 2px; font-weight: 800; }
    .status-expired  { background: #F0F0F0; color: #595959; }
    .status-draft    { background: #F4F6F8; color: var(--text-muted); }

    /* ═══════════════ ASPECT GAPS CARD ═══════════════ */
    .aspect-gaps-card {
      background: linear-gradient(135deg, var(--primary-1) 0%, #FFFFFF 100%);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      padding: 16px;
      margin-bottom: 16px;
      position: relative;
      overflow: visible;
    }
    .aspect-gaps-card-header { display: flex; align-items: center; margin-bottom: 14px; gap: 12px; }
    .aspect-gaps-title {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--neutral-8);
    }
    .ag-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .aspect-item {
      background: var(--surface-sunken);
      border-radius: var(--radius-md);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background 0.15s, box-shadow 0.15s, transform 0.15s;
      cursor: pointer;
      position: relative;
    }
    .aspect-item:hover { background: white; box-shadow: var(--shadow-sm); transform: translateY(-2px); }
    .aspect-name { font-family: var(--font-title); font-size: 13px; color: var(--neutral-8); }
    .aspect-item::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--neutral-8, #1a1a2e);
      color: #fff;
      font-family: var(--font-body);
      font-size: 11px;
      line-height: 1.5;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      width: 160px;
      text-align: center;
      white-space: normal;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 9999;
    }
    .aspect-item:hover::after { opacity: 1; }
    .aspect-progress { width: 100%; height: 6px; background: var(--surface-muted); border-radius: var(--radius-sm); overflow: hidden; }
    .aspect-progress-bar { height: 100%; background: #FFC107; border-radius: var(--radius-sm); transition: width 0.3s; }
    
    /* ═══════════════ EMPLOYEE LIST CARD ═══════════════ */
    .employee-list-card {
      background: white;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 16px;
    }
    
    /* ═══════════════ SEARCH & FILTER ═══════════════ */
    .search-filter-row {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .search-input {
      width: 200px;
      height: 32px;
      border: 1px solid var(--neutral-4);
      border-radius: var(--radius-pill);
      padding: 0 16px 0 36px;
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text-body);
      background: url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='11' cy='11' r='6' stroke='%23868E96' stroke-width='2'/%3E%3Cpath d='M20 20L17 17' stroke='%23868E96' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat 12px center;
      background-size: 16px;
    }
    
    .search-input::placeholder {
      color: var(--text-faint);
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    .aspect-chip {
      display: inline-block;
      background: var(--primary-1);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 800px;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }
    
    .status-chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 800px;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }
    
    .status-need-review {
      background: #FFEBE6;
      color: #DE350B;
    }
    
    .status-in-progress {
      background: #FFF4E6;
      color: #FD9F28;
    }
    
    .status-done {
      background: #E3FCEF;
      color: #00875A;
    }
    .insight-chips .status-chip { cursor: pointer; user-select: none; border: 1px solid rgba(0,0,0,0.10); box-shadow: 0 1px 1px rgba(0,0,0,0.04); transition: transform 0.12s, box-shadow 0.12s, filter 0.12s; }
    .insight-chips .status-chip:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.14); filter: brightness(0.97); }
    .insight-chips .status-chip:active { transform: translateY(0); box-shadow: 0 1px 2px rgba(0,0,0,0.10); }
    .insight-chips .status-chip.chip-insight-active { outline: 2px solid currentColor; outline-offset: 2px; font-weight: 800; }
    .insight-status-group { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .insight-status-group .ig-funnel { width: 13px; height: 13px; color: var(--text-muted); flex-shrink: 0; margin-right: -2px; }
    /* ═══ EMP TABLE ═══ */
    .emp-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .emp-table th, .emp-table td { width: 33.33%; }
    .emp-table thead tr { background: white; border-bottom: 1px solid var(--border); }
    .emp-table th { font-family: var(--font-title); font-size: 14px; font-weight: 800; color: var(--neutral-8); text-align: left; padding: 10px 16px; height: 44px; white-space: nowrap; }
    .emp-table td { padding: 10px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; height: 56px; }
    .emp-table tbody tr:last-child td { border-bottom: none; }
    .emp-table tbody tr { cursor: pointer; transition: background 0.1s; }
    .emp-table tbody tr:hover { background: var(--surface-sunken); }
    .emp-table tbody tr.row-selected { background: var(--primary-1); }
    .emp-cell-info { display: flex; align-items: center; gap: 10px; }
    .emp-cell-name { font-family: var(--font-title); font-size: 13px; font-weight: 700; color: var(--text-body); }
    .emp-cell-role { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .emp-cell-dept { font-family: var(--font-body); font-size: 12px; color: var(--text-body); }
    /* ═══ COLUMN FILTER ═══ */
    .cf-th-btn { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; background: none; border: none; padding: 0; font-family: var(--font-title); font-size: 14px; font-weight: 800; color: var(--neutral-8); }
    .cf-th-btn:hover .cf-filter-icon { color: var(--primary); }
    .cf-filter-icon { width: 11px; height: 11px; color: var(--text-muted); transition: color 0.15s; }
    .cf-filter-icon.active { color: var(--primary); }
    .cf-filter-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--primary); color: white; font-size: 10px; font-weight: 700; font-family: var(--font-title); }
    .cf-dropdown { position: fixed; z-index: 1000; background: white; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); min-width: 200px; overflow: hidden; }
    .cf-dropdown-item { display: flex; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer; font-family: var(--font-body); font-size: 13px; color: var(--text-body); }
    .cf-dropdown-item:hover { background: var(--surface-sunken); }
    .cf-dropdown-item.cf-selected { color: var(--primary); font-weight: 700; }
    .cf-check { width: 14px; height: 14px; color: var(--primary); flex-shrink: 0; }
    .cf-checkbox { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--border); border-radius: 3px; flex-shrink: 0; position: relative; }
    .cf-checkbox.checked::after { content: ''; position: absolute; inset: 2px; background: var(--primary); border-radius: 1px; }

    /* ═══ SIDE PANEL ═══ */
    .panel-backdrop { display: none; position: fixed; inset: 0; background: transparent; z-index: 200; }
    .panel-backdrop.open { display: block; pointer-events: none; }
    .idp-side-panel { position: fixed; top: 20px; right: -480px; bottom: 20px; width: 400px; background: white; border: 1.5px solid var(--primary); border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.16); z-index: 300; display: flex; flex-direction: column; transition: right 0.28s cubic-bezier(0.4,0,0.2,1); }
    .idp-side-panel.open { right: 20px; }
    .panel-assistant-tag { position: absolute; top: 0; left: 0; z-index: 2; background: white; border-right: 1.5px solid var(--primary); border-bottom: 1.5px solid var(--primary); border-radius: 16px 0 16px 0; padding: 12px 22px; font-family: var(--font-title); font-weight: 800; font-size: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .panel-beta { background: var(--primary); color: white; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.5px; }
    .panel-header { display: flex; align-items: center; gap: 12px; padding: 58px 20px 14px; flex-shrink: 0; }
    .panel-emp-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .panel-emp-name { font-family: var(--font-title); font-size: 18px; font-weight: 800; color: var(--text-body); }
    .panel-emp-meta { font-family: var(--font-body); font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .panel-tabs { display: flex; padding: 0 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .panel-tab { flex: 1; height: 42px; background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; transition: color 0.15s, border-color 0.15s; }
    .panel-tab:hover { color: var(--text-body); }
    .panel-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .panel-footer { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .panel-footer-btn { background: none; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-title); font-weight: 700; font-size: 13px; color: var(--text-body); }
    .panel-footer-btn span { text-decoration: underline; }
    .panel-footer-btn.link { color: var(--primary); }
    .panel-body { flex: 1; overflow-y: auto; padding: 20px; }
    .panel-section-label { font-family: var(--font-title); font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .panel-idp-card { background: var(--surface-sunken); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s; border: 1px solid transparent; }
    .panel-idp-card:hover { background: var(--surface-muted); border-color: var(--border); }
    .panel-idp-aspect { margin-bottom: 8px; }
    .panel-idp-meta { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .panel-idp-meta-row { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); }
    .panel-idp-meta-row strong { font-family: var(--font-title); color: var(--text-body); }
    /* ═══ PANEL CARD REDESIGN ═══ */
    .panel-card-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 5px; }
    .panel-card-row:last-child { margin-bottom: 0; }
    .panel-card-label { font-family: var(--font-title); font-size: 11px; font-weight: 700; color: var(--text-body); white-space: nowrap; min-width: 48px; flex-shrink: 0; padding-top: 1px; }
    .panel-card-value { font-family: var(--font-body); font-size: 11px; color: var(--text-muted); }
    .panel-card-program { font-family: var(--font-body); font-size: 11px; color: var(--text-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; cursor: default; }
    .panel-aspect-row { display: flex; flex-wrap: nowrap; overflow: hidden; gap: 4px; align-items: center; flex: 1; min-width: 0; }
    .panel-aspect-overflow { background: #F1F3F5; color: var(--text-muted); padding: 2px 8px; border-radius: 800px; font-family: var(--font-body); font-size: 10px; font-weight: 700; flex-shrink: 0; cursor: default; }
    .panel-av-group { display: inline-flex; align-items: center; }
    .panel-av { width: 22px; height: 22px; border-radius: 50%; border: 2px solid white; margin-left: -7px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: 9px; font-weight: 700; color: white; flex-shrink: 0; }
    .panel-av:first-child { margin-left: 0; }
    .panel-av-count { width: 22px; height: 22px; border-radius: 50%; border: 2px solid white; background: var(--surface-sunken); color: var(--text-body); font-family: var(--font-title); font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-left: -7px; flex-shrink: 0; cursor: pointer; }
    .panel-idp-pic-inline { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .panel-pic-name { font-family: var(--font-body); font-size: 11px; color: var(--text-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .panel-idp-status-inline { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
    .panel-progress-bar { width: 72px; height: 5px; background: #F0F0F0; border-radius: 3px; overflow: hidden; flex-shrink: 0; }
    .panel-progress-fill { height: 100%; border-radius: 3px; }
    .panel-progress-fill.fill-progress { background: var(--primary); }
    .panel-progress-fill.fill-done { background: var(--primary); }
    .panel-progress-fill.fill-pending { background: var(--primary); }
    .panel-progress-fill.fill-expired { background: var(--primary); }
    .panel-progress-count { font-family: var(--font-body); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .panel-progress-count.clr-progress { color: var(--text-muted); }
    .panel-progress-count.clr-done { color: var(--text-muted); }
    .panel-progress-count.clr-pending { color: var(--text-muted); }
    .panel-progress-count.clr-expired { color: var(--text-muted); }
    #panel-card-tooltip { position: fixed; z-index: 9999; background: #2A2D34; color: white; border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); display: none; max-width: 240px; pointer-events: none; }
    #panel-card-tooltip.open { display: block; }
    .panel-tt-title { font-family: var(--font-title); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; opacity: 0.7; margin-bottom: 6px; }
    .panel-tt-item { font-family: var(--font-body); font-size: 12px; padding: 2px 0; white-space: nowrap; }
    .panel-tt-av-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    .panel-tt-av-dot { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: 8px; font-weight: 700; color: white; flex-shrink: 0; }

    /* ═══ NOTIFICATION MODAL ═══ */
    .notif-backdrop { display: none; position: fixed; inset: 0; background: transparent; z-index: 400; }
    .notif-backdrop.open { display: block; }
    .notif-modal { position: fixed; top: 70px; right: 24px; background: white; width: 400px; max-width: calc(100vw - 32px); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 12px 40px rgba(0,0,0,0.16); display: flex; flex-direction: column; max-height: calc(100vh - 94px); overflow: hidden; transform-origin: top right; animation: notif-pop 0.16s ease-out; }
    @keyframes notif-pop { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .notif-modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .notif-modal-title { font-family: var(--font-sans); font-size: 12px; font-weight: 800; color: var(--text-body); }
    .notif-modal-sub { font-family: var(--font-sans); font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .notif-markread { background: none; border: none; cursor: pointer; font-family: var(--font-sans); font-size: 12px; font-weight: 700; color: var(--primary); padding: 0; white-space: nowrap; }
    .notif-markread:hover { opacity: 0.75; }
    .notif-list { flex: 1; overflow-y: auto; padding: 0 20px; }
    .notif-item { padding: 16px 0; border-bottom: 1px solid var(--border); }
    .notif-item:last-child { border-bottom: none; }
    .notif-item-head { display: flex; align-items: flex-start; gap: 10px; }
    .notif-item-title { flex: 1; font-family: var(--font-sans); font-size: 12px; font-weight: 800; color: var(--text-body); }
    .notif-unread-dot { width: 8px; height: 8px; border-radius: 50%; background: #e53e3e; flex-shrink: 0; margin-top: 4px; }
    .notif-item-desc { font-family: var(--font-sans); font-size: 12px; color: var(--text-body); line-height: 1.5; margin-top: 6px; }
    .notif-item-desc strong { font-family: var(--font-sans); font-weight: 700; }
    .notif-item-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .notif-quote { background: var(--surface-sunken); border-radius: 8px; padding: 10px 12px; font-family: var(--font-sans); font-size: 12px; color: var(--text-body); line-height: 1.5; margin-top: 10px; }
    .notif-time { font-family: var(--font-sans); font-size: 12px; color: var(--text-muted); margin-top: 10px; }

        var _sc={};emp.statuses.forEach(function(s){_sc[s.label]=(_sc[s.label]||0)+1;});
        var chips=[{l:'PENDING',c:'status-need-review'},{l:'IN PROGRESS',c:'status-in-progress'},{l:'DONE',c:'status-done'},{l:'EXPIRED',c:'status-expired'},{l:'DRAFT',c:'status-draft'}].filter(function(st){return (_sc[st.l]||0)>0;}).map(function(st){return '<span class="status-chip '+st.c+'" style="pointer-events:none">'+st.l+': '+_sc[st.l]+'</span>';}).join(' ');
        return '<tr onclick="openPanelById('+emp.id+',this)"><td><div class="emp-cell-info"><img src="'+emp.avatar+'" width="32" height="32" style="border-radius:50%;object-fit:cover" alt=""><div><div class="emp-cell-name">'+emp.name+'</div><div class="emp-cell-role">'+emp.role+'</div></div></div></td><td class="emp-cell-dept">'+emp.dept+'</td><td>'+chips+'</td></tr>';
      }).join('');
    }
    var _fltVddIdx=-1;
    function toggleFilterModal(e){
      e.stopPropagation();
      var modal=document.getElementById('filter-modal');
      if(modal.style.display==='none'){
        var btn=document.getElementById('filter-btn');
        var rect=btn.getBoundingClientRect();
        modal.style.top=(rect.bottom+6)+'px';
        modal.style.left=rect.left+'px';
        renderFilterConditions();
        modal.style.display='block';
      } else {
        modal.style.display='none';
        closeFilterVdd();
      }
    }
    function closeFilterModal(){
      var modal=document.getElementById('filter-modal');
      if(modal)modal.style.display='none';
      closeFilterVdd();
    }
    function addFilterCondition(){
      var used=_filterConditions.map(function(c){return c.field;});
      var avail=['Teams','Status'].filter(function(f){return used.indexOf(f)===-1;});
      if(avail.length===0)return;
      _filterConditions.push({field:avail[0],values:[]});
      renderFilterConditions();
    }
    function removeFilterCondition(idx){
      _filterConditions.splice(idx,1);
      renderFilterConditions();
      applyFilterConditions();
    }
    function setConditionField(idx,val){
      _filterConditions[idx].field=val;
      _filterConditions[idx].values=[];
      closeFilterVdd();
      renderFilterConditions();
      applyFilterConditions();
    }
    function openFilterVdd(idx,e){
      e.stopPropagation();
      _fltVddIdx=idx;
      var btn=e.currentTarget;
      var rect=btn.getBoundingClientRect();
      var dd=document.getElementById('flt-vdd');
      dd.style.top=(rect.bottom+4)+'px';
      dd.style.left=rect.left+'px';
      dd.style.minWidth=rect.width+'px';
      dd.style.display='block';
      renderFilterVddItems(idx);
    }
    function renderFilterVddItems(idx){
      var c=_filterConditions[idx];
      var vals=c.field==='Teams'?_TEAMS_VALS:_STATUS_VALS;
      var dd=document.getElementById('flt-vdd');
      dd.innerHTML=vals.map(function(v){
        var sel=c.values.indexOf(v)!==-1;
        var cls=c.field==='Status'?_STATUS_CLS[v]:'';
        var chip=cls?'<span class="status-chip '+cls+'" style="pointer-events:none">'+v+'</span>':'<span>'+v+'</span>';
        var check=sel?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="flex-shrink:0;color:var(--primary)"><polyline points="20 6 9 17 4 12"/></svg>':'<span style="display:inline-block;width:12px;flex-shrink:0"></span>';
        return '<div class="flt-vdd-item'+(sel?' flt-selected':'')+'" onclick="pickFilterValue('+idx+',\''+v+'\')" style="display:flex;align-items:center;gap:8px">'+check+chip+'</div>';
      }).join('');
    }
    function pickFilterValue(idx,val){
      var c=_filterConditions[idx];
      var vi=c.values.indexOf(val);
      if(vi===-1)c.values.push(val);else c.values.splice(vi,1);
      renderFilterVddItems(idx);
      renderFilterConditions();
      applyFilterConditions();
    }
    function closeFilterVdd(){
      var dd=document.getElementById('flt-vdd');
      if(dd)dd.style.display='none';
      _fltVddIdx=-1;
    }
    function renderFilterConditions(){
      var container=document.getElementById('flt-conditions');
      if(!container)return;
      var addBtn=document.querySelector('.flt-add-btn');
      if(_filterConditions.length===0){
        container.innerHTML='<div style="font-family:var(--font-body);font-size:12px;color:var(--text-muted);padding:4px 0;">No conditions. Click Add Condition to filter.</div>';
        if(addBtn)addBtn.style.display='';
        updateFilterBadge();return;
      }
      container.innerHTML=_filterConditions.map(function(c,i){
        var otherUsed=_filterConditions.filter(function(x,j){return j!==i;}).map(function(x){return x.field;});
        var fieldOpts=['Teams','Status'].map(function(f){
          var dis=otherUsed.indexOf(f)!==-1?' disabled':'';
          return '<option value="'+f+'"'+(c.field===f?' selected':'')+dis+'>'+f+'</option>';
        }).join('');
        var valContent=c.values.length>0
          ?c.values.map(function(v){var vc=c.field==='Status'?_STATUS_CLS[v]:'';return vc?'<span class="status-chip '+vc+'" style="pointer-events:none;font-size:10px">'+v+'</span>':'<span style="color:var(--text-body);font-size:12px;font-family:var(--font-body)">'+v+'</span>';}).join('')
          :'<span style="color:var(--text-muted)">Select...</span>';
        return '<div class="flt-row">'+
          '<select class="flt-field-sel" onchange="setConditionField('+i+',this.value)">'+fieldOpts+'</select>'+
          '<button class="flt-value-btn" onclick="openFilterVdd('+i+',event)"><span class="flt-value-btn-label">'+valContent+'</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><path d="M6 9l6 6 6-6"/></svg></button>'+
          '<button class="flt-del" onclick="removeFilterCondition('+i+')" title="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>'+
        '</div>';
      }).join('');
      if(addBtn)addBtn.style.display=_filterConditions.length>=2?'none':'';
      updateFilterBadge();
    }
    function applyFilterConditions(){
      _cfDepts=[];_cfStatuses=[];
      _filterConditions.forEach(function(c){
        c.values.forEach(function(v){
          if(c.field==='Teams'&&_cfDepts.indexOf(v)===-1)_cfDepts.push(v);
          if(c.field==='Status'&&_cfStatuses.indexOf(v)===-1)_cfStatuses.push(v);
        });
      });
      document.querySelectorAll('.insight-chips .status-chip').forEach(function(chip){
        chip.classList.toggle('chip-insight-active',_cfStatuses.indexOf(chip.getAttribute('data-filter-key'))!==-1);
      });
      renderCfTable();
    }
    function updateFilterBadge(){
      var n=_filterConditions.filter(function(c){return c.values.length>0;}).length;
      var badge=document.getElementById('filter-badge');
      var btn=document.getElementById('filter-btn');
      if(badge){badge.textContent=n;badge.style.display=n>0?'inline-flex':'none';}
      if(btn)btn.classList.toggle('active',n>0);
    }
    document.addEventListener('click',function(e){
      var modal=document.getElementById('filter-modal');
      var btn=document.getElementById('filter-btn');
      var dd=document.getElementById('flt-vdd');
      if(modal&&modal.style.display!=='none'&&btn&&!modal.contains(e.target)&&!btn.contains(e.target)&&!(dd&&dd.contains(e.target)))closeFilterModal();
      if(dd&&dd.style.display!=='none'&&!dd.contains(e.target))closeFilterVdd();
    });
    function updateInsightCounts(){
      var counts={};
      EMPLOYEES.forEach(function(emp){
        emp.statuses.forEach(function(s){ counts[s.label]=(counts[s.label]||0)+1; });
      });
      document.querySelectorAll('.insight-chips .status-chip').forEach(function(chip){
        var key=chip.getAttribute('data-filter-key');
        chip.textContent=key+': '+(counts[key]||0);
      });
    }
    document.addEventListener('DOMContentLoaded', function(){ renderCfTable(); updateInsightCounts(); renderAspectViews(); });

    function _buildIdpCard(idp) {
      var programRow = '<div class="panel-card-row"><span class="panel-card-label">Program:</span>'
        + '<span class="panel-card-program" title="'+(idp.program||'')+'">'+(idp.program||'-')+'</span></div>';

      var aspects = idp.aspects || (idp.aspect ? [idp.aspect] : []);
      var allAsp = aspects.map(function(a){ return a.replace(/\|/g,'&#124;'); }).join('||');
      var chipHtml = aspects.map(function(a){ return '<span class="aspect-chip">'+a.replace(/\s*\(\d+→\d+\)/,'')+'</span>'; }).join('');
      var aspectRow = '<div class="panel-card-row"><span class="panel-card-label">Aspek:</span>'
        + '<div class="panel-aspect-row" data-all-aspects="'+allAsp+'">'
        + chipHtml
        + '<span class="panel-aspect-overflow" style="display:none" data-aspects="'+allAsp+'">+0</span>'
        + '</div></div>';

      var pics = idp.pics || (idp.pic ? [{name:idp.pic,initials:idp.pic.substring(0,2).toUpperCase(),color:'#0EA5E9'}] : []);
      var picContent;
      if (pics.length === 1) {
        picContent = '<div class="panel-av" style="background:'+pics[0].color+'">'+pics[0].initials+'</div>'
                   + '<span class="panel-pic-name">'+pics[0].name+'</span>';
      } else {
        var shownPics = pics.slice(0,3);
        var extraPics = pics.slice(3);
        var allPicsEnc = pics.map(function(p){ return p.name.replace(/\|/g,'&#124;')+'||'+p.initials+'||'+p.color; }).join('__');
        picContent = '<div class="panel-av-group">';
        shownPics.forEach(function(p){ picContent += '<div class="panel-av" style="background:'+p.color+'">'+p.initials+'</div>'; });
        if (extraPics.length > 0) picContent += '<div class="panel-av-count" data-pics="'+allPicsEnc+'">+'+extraPics.length+'</div>';
        picContent += '</div>';
      }
      var picRow = '<div class="panel-card-row"><span class="panel-card-label">PIC:</span>'
        + '<div class="panel-idp-pic-inline">'+picContent+'</div></div>';

      var periodRow = '<div class="panel-card-row"><span class="panel-card-label">Period:</span>'
        + '<span class="panel-card-value">'+(idp.period||'')+'</span></div>';

      var prog = idp.progress || {done:0,total:1};
      var pct = prog.total > 0 ? Math.round(prog.done/prog.total*100) : 0;
      var fillCls = idp.statusCls==='status-done' ? 'fill-done'
                  : idp.statusCls==='status-in-progress' ? 'fill-progress'
                  : idp.statusCls==='status-need-review' ? 'fill-pending'
                  : 'fill-expired';
      var clrCls  = idp.statusCls==='status-done' ? 'clr-done'
                  : idp.statusCls==='status-in-progress' ? 'clr-progress'
                  : idp.statusCls==='status-need-review' ? 'clr-pending'
                  : 'clr-expired';
      var statusRow = '<div class="panel-card-row"><span class="panel-card-label">Status:</span>'
        + '<div class="panel-idp-status-inline">'
        + '<span class="status-chip '+idp.statusCls+'">'+idp.statusLabel+'</span>'
        + '<div class="panel-progress-bar"><div class="panel-progress-fill '+fillCls+'" style="width:'+pct+'%"></div></div>'
        + '<span class="panel-progress-count '+clrCls+'">'+prog.done+'/'+prog.total+'</span>'
        + '</div></div>';

      return '<div class="panel-idp-card" onclick="window.location.href=\'detail-idp-admin.html\'">'
        + programRow + aspectRow + picRow + periodRow + statusRow + '</div>';
    }

    function refreshAspectOverflow() {
      document.querySelectorAll('.panel-aspect-row').forEach(function(row) {
        var chips = Array.prototype.slice.call(row.querySelectorAll('.aspect-chip'));
        var overflow = row.querySelector('.panel-aspect-overflow');
        if (!chips.length || !overflow) return;
        chips.forEach(function(c){ c.style.display=''; });
        overflow.style.display = 'none';
        row.style.flexWrap = 'wrap';
        var firstTop = chips[0].getBoundingClientRect().top;
        var firstHidden = -1;
        for (var i=1; i<chips.length; i++) {
          if (chips[i].getBoundingClientRect().top > firstTop + 2) { firstHidden = i; break; }
        }
        row.style.flexWrap = '';
        if (firstHidden !== -1) {
          chips.slice(firstHidden).forEach(function(c){ c.style.display='none'; });
          overflow.textContent = '+'+(chips.length - firstHidden);
          overflow.style.display = '';
        }
      });
    }

    (function() {
      var _tt;
      function getTip() {
        if (!_tt) { _tt = document.createElement('div'); _tt.id = 'panel-card-tooltip'; document.body.appendChild(_tt); }
        return _tt;
      }
      function showTip(el, title, items, isAv) {
        var tt = getTip();
        var h = '<div class="panel-tt-title">'+title+'</div>';
        items.forEach(function(item) {
          h += isAv
            ? '<div class="panel-tt-av-row"><div class="panel-tt-av-dot" style="background:'+item.color+'">'+item.initials+'</div><span class="panel-tt-item">'+item.name+'</span></div>'
            : '<div class="panel-tt-item">'+item+'</div>';
        });
        tt.innerHTML = h;
        tt.classList.add('open');
        var r = el.getBoundingClientRect();
        tt.style.top = '-9999px'; tt.style.left = '-9999px';
        requestAnimationFrame(function() {
          var tw = tt.offsetWidth, th = tt.offsetHeight;
          var l = r.left + r.width/2 - tw/2;
          var t = r.top - th - 8;
          if (l < 8) l = 8;
          if (l + tw > window.innerWidth - 8) l = window.innerWidth - tw - 8;
          if (t < 8) t = r.bottom + 8;
          tt.style.left = l+'px'; tt.style.top = t+'px';
        });
      }
      function hideTip() { if (_tt) _tt.classList.remove('open'); }
      document.addEventListener('mouseover', function(e) {
        var el = e.target.closest('.panel-aspect-overflow[data-aspects]');
        if (el) {
          var aspects = (el.getAttribute('data-aspects')||'').split('||').filter(Boolean);
          showTip(el, 'Aspects', aspects, false); return;
        }
        el = e.target.closest('.panel-av-count[data-pics]');
        if (el) {
          var pics = (el.getAttribute('data-pics')||'').split('__').filter(Boolean).map(function(s){
            var p=s.split('||'); return {name:p[0]||'',initials:p[1]||'?',color:p[2]||'#ccc'};
          });
          showTip(el, 'PIC', pics, true);
        }
      });
      document.addEventListener('mouseout', function(e) {
        if (e.target.closest('.panel-aspect-overflow,.panel-av-count')) hideTip();
      });
    })();
  </script>

  <script>
    var NOTIFICATIONS = [
      { title: 'IDP Review Required', desc: 'A new IDP submitted by Kylian Mbappe for Florian Wirtz is waiting for your review.', tags: [{label:'NEED REVIEW', cls:'status-chip status-need-review'}], quote: 'Please review and approve the development plan to continue the process.', time: '1 day ago', unread: true },
      { title: 'New Comment on Development Program', desc: '<strong>Virgil van Dijk</strong> commented on the development program "Leadership Workshop 2026".', tags: [], quote: 'Tolong atur jadwal dengan saya besok senin, cari jam kosong', time: '1 day ago', unread: true },
      { title: 'IDP Approved', desc: 'The IDP you submitted for Florian Wirtz has been reviewed and approved by Admin.', tags: [{label:'LEADERSHIP', cls:'aspect-chip'}], quote: 'The employee can now begin the development activities as planned.', time: '1 day ago', unread: true },
      { title: 'New IDP Assignment for your Team Member', desc: 'You have been assigned as the PIC for an IDP created for Florian Wirtz.', tags: [{label:'CRITICAL THINKING', cls:'aspect-chip'}], quote: "Please review the assigned IDP and support the employee's development journey.", time: '1 day ago', unread: true },
      { title: 'IDP Submission Rejected', desc: 'The IDP you submitted for Florian Wirtz was not approved by Admin.', tags: [{label:'COMMUNICATION', cls:'aspect-chip'}], quote: 'Please review the provided comments and submit a revised development plan.', time: '1 day ago', unread: true },
      { title: 'New IDP Assigned', desc: 'You have been assigned an IDP by Florian Wirtz', tags: [{label:'CRITICAL THINKING', cls:'aspect-chip'},{label:'LEADERSHIP', cls:'aspect-chip'}], quote: 'Please review your IDP and begin your development activities accordingly.', time: '1 day ago', unread: true }
    ];

    function renderNotifications() {
      var list = document.getElementById('notif-list');
      if (!list) return;
      list.innerHTML = NOTIFICATIONS.map(function(n) {
        var tags = n.tags.length ? '<div class="notif-item-tags">' + n.tags.map(function(t){ return '<span class="'+t.cls+'">'+t.label+'</span>'; }).join('') + '</div>' : '';
        var dot = n.unread ? '<span class="notif-unread-dot"></span>' : '';
        var quote = n.quote ? '<div class="notif-quote">“'+n.quote+'”</div>' : '';
        return '<div class="notif-item"><div class="notif-item-head"><div class="notif-item-title">'+n.title+'</div>'+dot+'</div><div class="notif-item-desc">'+n.desc+'</div>'+tags+quote+'<div class="notif-time">'+n.time+'</div></div>';
      }).join('');
      updateNotifSub();
    }
    function updateNotifSub() {
      var unread = NOTIFICATIONS.filter(function(n){ return n.unread; }).length;
      var sub = document.getElementById('notif-sub');
      if (sub) sub.textContent = unread === 0 ? 'No unread notifications' : unread + (unread === 1 ? ' unread notification' : ' unread notifications');
      var dot = document.querySelector('.btn-bell .notif-dot');
      if (dot) dot.style.display = unread === 0 ? 'none' : 'block';
    }
    function openNotif() { renderNotifications(); document.getElementById('notif-backdrop').classList.add('open'); }
    function closeNotif() { document.getElementById('notif-backdrop').classList.remove('open'); }
    function markAllNotifRead() { NOTIFICATIONS.forEach(function(n){ n.unread = false; }); renderNotifications(); }
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeNotif(); });
    updateNotifSub();
  </script>

  <!-- ═══ User Switcher ═══ -->
  <style>
    #user-switcher { position: fixed; bottom: 20px; left: 20px; z-index: 9999; }
    #switcher-menu {
      display: none; position: absolute; bottom: calc(100% + 8px); left: 0;
      background: white; border: 1px solid var(--border); border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg); overflow: hidden; min-width: 150px;
    }
    .sw-option {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 9px 14px; background: none; border: none;
      font-size: 12px; font-family: var(--font-body); color: var(--text-body);
      cursor: pointer; text-align: left;
    }
    .sw-option:hover { background: var(--surface-sunken); }
    .sw-option.sw-active { color: var(--primary); font-weight: 700; }
    .sw-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--neutral-4); flex-shrink: 0; }
    .sw-option.sw-active .sw-dot { background: var(--primary); }
    #switcher-trigger {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      background: white; border: 1px solid var(--border); border-radius: var(--radius-pill);
      font-size: 12px; font-family: var(--font-body); color: var(--text-muted);
      cursor: pointer; box-shadow: var(--shadow-sm); white-space: nowrap;
    }
    #switcher-trigger:hover { border-color: var(--primary); color: var(--primary); }
  </style>
  <div id="user-switcher">
    <div id="switcher-menu">
      <button class="sw-option" onclick="swSwitch('Admin')"><span class="sw-dot"></span>Admin</button>
      <button class="sw-option" onclick="swSwitch('Manager')"><span class="sw-dot"></span>Manager</button>
      <button class="sw-option" onclick="swSwitch('Employee')"><span class="sw-dot"></span>Employee</button>
    </div>
    <button id="switcher-trigger" onclick="swToggle(event)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span id="sw-label">Admin</span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <script>
    (function(){
      var KEY='idp-role';
      function cur(){ return localStorage.getItem(KEY)||'Admin'; }
      function render(r){
        document.getElementById('sw-label').textContent=r;
        document.querySelectorAll('.sw-option').forEach(function(b){
          b.classList.toggle('sw-active', b.textContent.trim()===r);
        });
      }
      window.swToggle=function(e){ e.stopPropagation(); var m=document.getElementById('switcher-menu'); m.style.display=m.style.display==='block'?'none':'block'; };
      window.swSwitch=function(r){
        localStorage.setItem(KEY,r);
        document.getElementById('switcher-menu').style.display='none';
        if(r==='Employee') window.location.href='/detail-idp-employee.html';
        else if(r==='Manager') window.location.href='/monitoring-manager.html';
        else render(r);
      };
      document.addEventListener('click',function(e){ if(!document.getElementById('user-switcher').contains(e.target)) document.getElementById('switcher-menu').style.display='none'; });
      localStorage.setItem(KEY,'Admin'); render('Admin');
    })();
  </script>
</body>
</html>
