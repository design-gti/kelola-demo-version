<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review IDP List - Talentlytica</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="design-system/styles.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--surface-sunken);
      padding: 24px;
    }

    .page-wrapper {
      max-width: 1158px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Breadcrumb header ── */
    .page-header {
      display: flex;
      align-items: center;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-body);
      font-size: 13px;
    }

    .breadcrumb-back {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      padding: 0;
      line-height: 1;
    }
    .breadcrumb-back:hover { color: var(--primary); }

    .breadcrumb-link {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      padding: 0;
    }
    .breadcrumb-link:hover { color: var(--primary); }

    .breadcrumb-sep {
      color: var(--text-faint);
      font-size: 13px;
      user-select: none;
    }

    .breadcrumb-current {
      font-weight: 600;
      color: var(--text-body);
    }

    /* ── Review card ── */
    .review-card {
      background: var(--surface-card);
      border-radius: var(--radius-md);
      padding: 16px 16px 8px;
      box-shadow: var(--shadow-sm);
    }

    .review-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .review-title {
      font-family: var(--font-title);
      font-size: 14px;
      font-weight: 800;
      color: var(--text-title);
      white-space: nowrap;
    }

    .review-sep {
      width: 1px;
      height: 14px;
      background: var(--border);
      flex-shrink: 0;
    }

    .review-subtitle {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Search & Filter ── */
    .search-filter-row {
      display: flex;
      gap: 4px;
      align-items: center;
      margin: 14px 0;
    }

    .search-input {
      width: 200px;
      height: 32px;
      border: 1px solid var(--neutral-4);
      border-radius: var(--radius-pill);
      padding: 0 16px 0 36px;
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text-body);
      background: url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='11' cy='11' r='6' stroke='%23868E96' stroke-width='2'/%3E%3Cpath d='M20 20L17 17' stroke='%23868E96' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat 12px center;
      background-size: 16px;
    }
    .search-input::placeholder { color: var(--text-faint); }
    .search-input:focus { outline: none; border-color: var(--primary); }

    .btn-filter { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border: none; border-radius: var(--radius-pill); background: transparent; font-family: var(--font-title); font-size: var(--type-subtitle-size); font-weight: 700; color: var(--primary); cursor: pointer; transition: background var(--duration-base); white-space: nowrap; }
    .btn-filter:hover { background: var(--primary-1); }
    .btn-filter-icon { width: 16px; height: 16px; flex-shrink: 0; }
    .filter-badge { background: var(--primary); color: white; font-family: var(--font-title); font-size: 9px; font-weight: 700; border-radius: 999px; min-width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }
    .btn-filter.active { background: var(--primary-1); }

    /* ── Filter Modal ── */
    .filter-modal { position: fixed; background: white; width: 500px; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: 0 8px 32px rgba(0,0,0,0.14); z-index: 500; overflow: hidden; }
    .flt-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; border-bottom: 1px solid var(--border); }
    .flt-title { font-family: var(--font-title); font-size: 13px; font-weight: 700; color: var(--text-body); }
    .flt-close { background: none; border: none; cursor: pointer; color: var(--text-muted); width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 4px; padding: 0; }
    .flt-close:hover { background: var(--surface-sunken); color: var(--text-body); }
    .flt-meeting { padding: 10px 16px; border-bottom: 1px solid var(--border); font-family: var(--font-body); font-size: 12px; color: var(--text-muted); }
    .flt-meeting strong { color: var(--text-body); font-family: var(--font-title); }
    .flt-conditions { padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
    .flt-row { display: flex; align-items: center; gap: 8px; }
    .flt-field-sel { flex: 0 0 120px; height: 32px; border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; font-family: var(--font-body); font-size: 12px; color: var(--text-body); background: white url("data:image/svg+xml,%3Csvg width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%23868E96' stroke-width='2.5'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E") no-repeat right 8px center; background-size: 10px; cursor: pointer; appearance: none; -webkit-appearance: none; }
    .flt-value-btn { flex: 1; height: 32px; border: 1px solid var(--border); border-radius: 999px; padding: 0 8px 0 10px; font-family: var(--font-body); font-size: 12px; background: white; cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; color: var(--text-body); outline: none; }
    .flt-value-btn:hover, .flt-value-btn:focus { border-color: var(--primary); }
    .flt-value-btn-label { flex: 1; display: flex; flex-wrap: nowrap; gap: 3px; align-items: center; overflow: hidden; min-width: 0; }
    .flt-value-btn-label > * { flex-shrink: 0; white-space: nowrap; }
    .flt-value-btn-label .aspect-chip { max-width: none; }
    .flt-del { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; display: flex; align-items: center; flex-shrink: 0; border-radius: 4px; }
    .flt-del:hover { color: #e53e3e; background: #FFEBE6; }
    .flt-footer { padding: 10px 16px 14px; border-top: 1px solid var(--border); }
    .flt-add-btn { background: none; border: none; cursor: pointer; font-family: var(--font-body); font-size: 12px; color: var(--primary); padding: 0; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .flt-add-btn:hover { opacity: 0.75; }
    .flt-vdd { position: fixed; background: white; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: 0 4px 16px rgba(0,0,0,0.12); z-index: 600; min-width: 180px; overflow: hidden; max-height: 220px; overflow-y: auto; }
    .flt-vdd-item { padding: 8px 12px; font-family: var(--font-body); font-size: 12px; color: var(--text-body); cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .flt-vdd-item:hover { background: var(--surface-sunken); }
    .flt-vdd-item.flt-selected { background: var(--primary-1); }

    /* ── Table scroll wrapper ── */
    .table-scroll-wrapper {
      overflow-x: auto;
      margin: 0 -16px;
    }

    /* ── Table ── */
    .review-table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .review-table .col-cb { width: 40px; padding-left: 16px; padding-right: 4px; }
    .review-table .col-actions { width: 116px; }

    /* ── Sticky columns ── */
    .review-table th.col-cb,
    .review-table td.col-cb {
      position: sticky;
      left: 0;
      z-index: 3;
      background: var(--surface-card);
    }
    .review-table th.col-reqby,
    .review-table td.col-reqby {
      position: sticky;
      left: 40px;
      z-index: 3;
      background: var(--surface-card);
      border-right: 1px solid var(--border);
    }
    .review-table th.col-actions,
    .review-table td.col-actions {
      position: sticky;
      right: 0;
      z-index: 3;
      background: var(--surface-card);
      border-left: 1px solid var(--border);
    }
    .review-table tbody tr:hover td.col-cb,
    .review-table tbody tr:hover td.col-reqby,
    .review-table tbody tr:hover td.col-actions {
      background: var(--surface-sunken);
    }

    /* ── Aspect multi-chip cell ── */
    .aspect-cell { display: inline-flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
    .aspect-more {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 20px;
      padding: 0 6px;
      background: var(--surface-sunken);
      color: var(--text-body);
      font-family: var(--font-title);
      font-size: 10px;
      font-weight: 700;
      border-radius: 999px;
      cursor: default;
      flex-shrink: 0;
    }
    .aspect-tip {
      position: fixed;
      z-index: 10002;
      background: #2A2D34;
      color: white;
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      display: none;
      max-width: 260px;
    }
    .aspect-tip.open { display: block; }
    .aspect-tip-title { font-family: var(--font-title); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; opacity: 0.7; margin-bottom: 6px; }
    .aspect-tip-item { font-family: var(--font-body); font-size: 12px; padding: 2px 0; white-space: nowrap; }

    .review-table thead tr { border-bottom: 1px solid var(--border); }

    .review-table th {
      font-family: var(--font-title);
      font-size: 14px;
      font-weight: 800;
      color: var(--neutral-8);
      text-align: left;
      padding: 10px 16px;
      white-space: nowrap;
      height: 44px;
    }

    .review-table td {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text-body);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      height: 56px;
      overflow: hidden;
    }

    .review-table tbody tr:last-child td { border-bottom: none; }
    .review-table tbody tr:hover td { background: var(--surface-sunken); }

    /* ── Employee cell ── */
    .emp-cell { display: flex; align-items: center; gap: 10px; }

    .emp-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-title);
      font-size: 13px;
      font-weight: 800;
      color: white;
      flex-shrink: 0;
    }

    .emp-name {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-body);
    }

    .emp-meta {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Stacked avatar cell (Participant / PIC) ── */
    .pcp-cell { display: inline-flex; align-items: center; cursor: default; }
    .pcp-avatars { display: inline-flex; align-items: center; }
    .pcp-av { width: 28px; height: 28px; border-radius: 50%; border: 2px solid white; background-size: cover; background-position: center; margin-left: -8px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: 10px; font-weight: 700; color: white; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.05); }
    .pcp-av:first-child { margin-left: 0; }
    .pcp-count { width: 28px; height: 28px; border-radius: 50%; border: 2px solid white; background: var(--surface-sunken); color: var(--text-body); font-family: var(--font-title); font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-left: -8px; flex-shrink: 0; }

    /* ── Avatar hover tooltip (full names) ── */
    .pcp-tooltip { position: fixed; z-index: 10002; background: #2A2D34; color: white; border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); display: none; max-width: 240px; }
    .pcp-tooltip.open { display: block; }
    .pcp-tooltip-title { font-family: var(--font-title); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; opacity: 0.7; margin-bottom: 6px; }
    .pcp-tt-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-family: var(--font-body); font-size: 12px; white-space: nowrap; }
    .pcp-tt-av { width: 20px; height: 20px; border-radius: 50%; background-size: cover; background-position: center; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: 8px; font-weight: 700; color: white; flex-shrink: 0; }

    /* ── Aspect chip ── */
    .aspect-chip {
      display: inline-block;
      background: var(--primary-1);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 800px;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
      max-width: 148px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .aspect-chip.leadership {
      background: var(--primary-1);
      color: var(--primary);
    }

    /* ── Vendor cell ── */
    .vendor-main { font-size: 12px; color: var(--text-body); }
    .vendor-sub  { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ── Checkbox cell ── */
    .row-cb { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); }

    /* ── PIC cell (avatar + name + position) ── */
    .pic-name  { font-size: 12px; font-weight: 700; color: var(--text-body); }
    .pic-pos   { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ── Submitted cell ── */
    .sub-date { font-size: 12px; color: var(--text-body); }

    /* ── Action buttons ── */
    .action-buttons { display: flex; align-items: center; gap: 6px; }

    .icon-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: none;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }

    .icon-btn-view {
      background: var(--surface-sunken);
      color: var(--text-muted);
    }
    .icon-btn-view:hover { background: var(--border); color: var(--text-body); }

    .icon-btn-reject {
      background: var(--error-0);
      color: var(--error);
    }
    .icon-btn-reject:hover { background: #fecaca; }

    .icon-btn-approve {
      background: var(--primary-1);
      color: var(--primary);
    }
    .icon-btn-approve:hover { background: var(--primary); color: white; }

    /* Tooltip — handled by JS fixed tooltip */
    .icon-btn .icon-tooltip { display: none !important; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-faint);
      font-size: 13px;
    }

    /* ── User Switcher (same as other pages) ── */
    #user-switcher { position: fixed; bottom: 20px; left: 20px; z-index: 9999; }
    #switcher-menu {
      display: none; position: absolute; bottom: calc(100% + 8px); left: 0;
      background: white; border: 1px solid var(--border); border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg); overflow: hidden; min-width: 150px;
    }
    .sw-option {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 9px 14px; background: none; border: none;
      font-size: 12px; font-family: var(--font-body); color: var(--text-body);
      cursor: pointer; text-align: left;
    }
    .sw-option:hover { background: var(--surface-sunken); }
    .sw-option.sw-active { color: var(--primary); font-weight: 700; }
    .sw-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--neutral-4); flex-shrink: 0; }
    .sw-option.sw-active .sw-dot { background: var(--primary); }
    #switcher-trigger {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      background: white; border: 1px solid var(--border); border-radius: var(--radius-pill);
      font-size: 12px; font-family: var(--font-body); color: var(--text-muted);
      cursor: pointer; box-shadow: var(--shadow-sm); white-space: nowrap;
    }
    #switcher-trigger:hover { border-color: var(--primary); color: var(--primary); }

    /* ── Bulk-action floating bar ── */
    .bulk-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), opacity 0.18s ease;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-pill);
      box-shadow: 0 8px 32px rgba(0,0,0,0.14);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px 6px 16px;
      z-index: 8000;
      white-space: nowrap;
    }
    .bulk-bar.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: all;
    }
    .bulk-bar-label {
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-muted);
      padding-right: 8px;
      border-right: 1px solid var(--border);
      margin-right: 4px;
    }
    .bulk-bar-label strong { color: var(--text-body); }
    .bulk-bar-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px;
      border: none;
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .bulk-bar-btn-reject {
      background: var(--error-0);
      color: var(--error);
    }
    .bulk-bar-btn-reject:hover { background: #fecaca; }
    .bulk-bar-btn-approve {
      background: var(--primary-1);
      color: var(--primary);
    }
    .bulk-bar-btn-approve:hover { background: var(--primary); color: white; }

    /* ── Reject IDP Modal ── */
    .reject-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .reject-modal-overlay.open { display: flex; }
    .reject-modal { background: white; border-radius: 12px; width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); overflow: hidden; }
    .reject-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
    .reject-modal-title { font-family: var(--font-title); font-size: 15px; font-weight: 700; color: var(--text-title); }
    .reject-modal-close { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 20px; line-height: 1; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    .reject-modal-close:hover { background: var(--surface-sunken); color: var(--text-body); }
    .reject-modal-body { padding: 20px 20px 16px; }
    .reject-modal-label { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--text-body); margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
    .reject-modal-label .req { color: var(--error); }
    .reject-modal-textarea { width: 100%; min-height: 88px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: var(--font-body); font-size: 13px; color: var(--text-body); resize: vertical; outline: none; transition: border-color 0.15s; }
    .reject-modal-textarea:focus { border-color: var(--primary); }
    .reject-modal-textarea::placeholder { color: var(--text-faint); }
    .reject-modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; }
    .reject-modal-cancel { background: white; color: var(--text-body); border: 1.5px solid var(--border); padding: 0 20px; height: 36px; border-radius: var(--radius-pill); font-family: var(--font-title); font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .reject-modal-cancel:hover { background: var(--surface-sunken); }
    .reject-modal-submit { background: var(--error); color: white; border: none; padding: 0 20px; height: 36px; border-radius: var(--radius-pill); font-family: var(--font-title); font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    .reject-modal-submit:disabled { opacity: 0.45; cursor: not-allowed; }
    .reject-modal-submit:not(:disabled):hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="page-wrapper" style="padding: 0; max-width: none; margin: 0;">

    <!-- Breadcrumb header -->
    <div class="page-header">
      <nav class="breadcrumb">
        <button class="breadcrumb-back" onclick="window.location.href='monitoring-admin.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <button class="breadcrumb-link" onclick="window.location.href='monitoring-admin.html'">Monitoring</button>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-current">Review IDP List</span>
      </nav>
    </div>

    <!-- Review card -->
    <div class="review-card">
      <div class="review-header">
        <div class="review-title">Pending Review: 3</div>
        <div class="review-sep"></div>
        <div class="review-subtitle">Review and approve IDP requests from Managers</div>
      </div>

      <div class="search-filter-row">

          <span class="filter-badge" id="filter-badge" style="display:none">0</span>

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

  <script>
  /* ═══ Stacked avatar cells (Participant / PIC) + hover tooltip ═══ */
  (function(){
    var PHOTO_MAP = { 'Cody Gakpo': 'assets/avatar-1.png', 'Virgil van Dijk': 'assets/avatar-2.png' };
    var PALETTE = ['#4C6EF5','#7950F2','#E8590C','#0CA678','#1098AD','#F03E3E','#F76707','#9C36B5','#1971C2','#2F9E44'];
    var MAX_AV = 3;
    var _tip = null;

    function initials(name){
      var p = name.trim().split(/\s+/);
      var a = (p[0]||'?')[0] || '?';
      var b = (p[1]||'')[0] || '';
      return (a + b).toUpperCase();
    }
    function colorFor(name){
      var s = 0; for (var i=0;i<name.length;i++) s += name.charCodeAt(i);
      return PALETTE[s % PALETTE.length];
    }
    function avatarMarkup(name, avClass){
      var photo = PHOTO_MAP[name];
      if (photo) return '<span class="'+avClass+'" style="background-image:url(\''+photo+'\')"></span>';
      return '<span class="'+avClass+'" style="background:'+colorFor(name)+'">'+initials(name)+'</span>';
    }
    function getPeople(cell){ try { return JSON.parse(cell.dataset.people || '[]'); } catch(e){ return []; } }

    function renderCell(cell){
      var people = getPeople(cell);
      var html = '<span class="pcp-avatars">';
      people.slice(0, MAX_AV).forEach(function(n){ html += avatarMarkup(n, 'pcp-av'); });
      if (people.length > MAX_AV) html += '<span class="pcp-count">+'+(people.length - MAX_AV)+'</span>';
      html += '</span>';
      cell.innerHTML = html;
    }

    window.showPcpTip = function(cell){
      var people = getPeople(cell);
      if (!people.length) return;
      var kind = cell.dataset.pcpKind || 'Participant';
      _tip.innerHTML = '<div class="pcp-tooltip-title">'+kind+' ('+people.length+')</div>' +
        people.map(function(n){ return '<div class="pcp-tt-item">'+avatarMarkup(n,'pcp-tt-av')+'<span>'+n+'</span></div>'; }).join('');
      _tip.classList.add('open');
      var r = cell.getBoundingClientRect();
      var th = _tip.offsetHeight, tw = _tip.offsetWidth;
      var left = Math.max(4, Math.min(r.left, window.innerWidth - tw - 8));
      var top = (r.top - th - 8 < 0) ? r.bottom + 8 : r.top - th - 8;
      _tip.style.left = left + 'px';
      _tip.style.top = top + 'px';
    };
    window.hidePcpTip = function(){ if (_tip) _tip.classList.remove('open'); };

    window.__renderPcp = function(){ document.querySelectorAll('.pcp-cell').forEach(renderCell); };
    function init(){
      _tip = document.createElement('div');
      _tip.className = 'pcp-tooltip';
      _tip.id = 'pcpTooltip';
      document.body.appendChild(_tip);
      document.querySelectorAll('.pcp-cell').forEach(renderCell);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  })();

  (function(){
    var tip = document.createElement('div');
    tip.id = 'iconTooltip';
    tip.style.cssText = 'position:fixed;background:rgba(26,26,26,0.92);color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;white-space:nowrap;pointer-events:none;z-index:99999;opacity:0;transition:opacity 0.12s;font-family:"Open Sans",sans-serif;display:block;';
    document.body.appendChild(tip);
    document.addEventListener('mouseover', function(e){
      var btn = e.target.closest('[data-tooltip]');
      if(!btn) return;
      tip.textContent = btn.dataset.tooltip;
      var r = btn.getBoundingClientRect();
      tip.style.opacity = '0';
      setTimeout(function(){
        var tw = tip.offsetWidth, th = tip.offsetHeight;
        var left = r.left + r.width/2 - tw/2;
        if(left < 4) left = 4;
        if(left + tw > window.innerWidth - 4) left = window.innerWidth - tw - 4;
        tip.style.left = left + 'px';
        tip.style.top = (r.top - th - 6) + 'px';
        tip.style.opacity = '1';
      }, 0);
    });
    document.addEventListener('mouseout', function(e){
      if(e.target.closest('[data-tooltip]')) tip.style.opacity = '0';
    });
  })();

  /* ═══ Filter Panel ═══ */
  (function(){
    var FIELDS = ['Requested by','Participant','Aspect','PIC','Submitted'];
    var FIELD_TYPES = { 'Requested by':'multi', Participant:'multi', Aspect:'multi', PIC:'multi', Submitted:'date' };
    var _conditions = [];
    var _fltVddIdx = -1;

    function getUniqVals(sel){
      var seen = {}, vals = [];
      document.querySelectorAll('.review-table tbody tr').forEach(function(row){
        var el = row.querySelector(sel);
        var v = el ? el.textContent.trim() : '';
        if(v && !seen[v]){ seen[v]=1; vals.push(v); }
      });
      return vals;
    }
    function getPeopleByKind(row, kind){
      var cell = row.querySelector('.pcp-cell[data-pcp-kind="'+kind+'"]');
      if(!cell) return [];
      try { return JSON.parse(cell.dataset.people || '[]'); } catch(e){ return []; }
    }
    function getUniqPeople(kind){
      var seen = {}, vals = [];
      document.querySelectorAll('.review-table tbody tr').forEach(function(row){
        getPeopleByKind(row, kind).forEach(function(v){
          if(v && !seen[v]){ seen[v]=1; vals.push(v); }
        });
      });
      return vals;
    }
    function fieldVals(field){
      if(field==='Requested by') return getUniqVals('.reqby-name');
      if(field==='Participant')  return getUniqPeople('Participant');
      if(field==='Aspect')       return getUniqVals('.aspect-chip');
      if(field==='PIC')          return getUniqPeople('PIC');
      return [];
    }
    function parseSubDate(row){
      var el = row.querySelector('.sub-date');
      if(!el) return null;
      var d = el.getAttribute('data-date');
      return d ? new Date(d) : null;
    }

    function applyFilter(){
      var q = (document.getElementById('reviewSearch')||{value:''}).value.trim().toLowerCase();
      document.querySelectorAll('.review-table tbody tr').forEach(function(row){
        if(q){
          var hay = getPeopleByKind(row,'Participant').join(' ').toLowerCase();
          if(hay.indexOf(q)===-1){ row.style.display='none'; return; }
        }
        var show = true;
        _conditions.forEach(function(c){
          if(!show) return;
          var type = FIELD_TYPES[c.field];
          if(type==='multi' && c.values.length>0){
            if(c.field==='Participant' || c.field==='PIC'){
              var ppl = getPeopleByKind(row, c.field);
              var hit = ppl.some(function(p){ return c.values.indexOf(p)!==-1; });
              if(!hit) show=false;
            } else {
              var cv='';
              if(c.field==='Requested by') cv=(row.querySelector('.reqby-name')||{textContent:''}).textContent.trim();
              if(c.field==='Aspect')       cv=(row.querySelector('.aspect-chip')||{textContent:''}).textContent.trim();
              if(c.values.indexOf(cv)===-1) show=false;
            }
          }
          if(type==='date' && c.dateVal){
            var rd=parseSubDate(row), fd=new Date(c.dateVal);
            if(!rd || rd<fd) show=false;
          }
        });
        row.style.display = show ? '' : 'none';
      });
      updateBadge();
    }

    function updateBadge(){
      var n=_conditions.filter(function(c){
        var t=FIELD_TYPES[c.field];
        return (t==='multi'&&c.values.length>0)||(t==='number'&&c.numVal!=='')||(t==='date'&&!!c.dateVal);
      }).length;
      var badge=document.getElementById('filter-badge'), btn=document.getElementById('filter-btn');
      if(badge){ badge.textContent=n; badge.style.display=n>0?'inline-flex':'none'; }
      if(btn) btn.classList.toggle('active', n>0);
    }

    window.toggleFilterModal=function(e){
      e.stopPropagation();
      var modal=document.getElementById('filter-modal');
      if(!modal.style.display||modal.style.display==='none'){
        var rect=document.getElementById('filter-btn').getBoundingClientRect();
        modal.style.top=(rect.bottom+6)+'px';
        modal.style.left=rect.left+'px';
        renderConds();
        modal.style.display='block';
      } else { modal.style.display='none'; closeVdd(); }
    };
    window.closeFilterModal=function(){
      var m=document.getElementById('filter-modal'); if(m) m.style.display='none'; closeVdd();
    };
    window.addFilterCondition=function(){
      var used=_conditions.map(function(c){return c.field;});
      var avail=FIELDS.filter(function(f){return used.indexOf(f)===-1;});
      if(!avail.length) return;
      _conditions.push({field:avail[0],values:[],numVal:'',dateVal:''});
      renderConds();
    };
    window.removeFilterCondition=function(i){
      _conditions.splice(i,1); renderConds(); applyFilter();
    };
    window.setConditionField=function(i,v){
      _conditions[i]={field:v,values:[],numVal:'',dateVal:''}; closeVdd(); renderConds(); applyFilter();
    };
    window.setConditionNum=function(i,v){
      _conditions[i].numVal=v; applyFilter();
    };
    window.setConditionDate=function(i,v){
      _conditions[i].dateVal=v; applyFilter();
    };
    window.openFilterVdd=function(i,e){
      e.stopPropagation(); _fltVddIdx=i;
      var rect=e.currentTarget.getBoundingClientRect();
      var dd=document.getElementById('flt-vdd');
      dd.style.top=(rect.bottom+4)+'px'; dd.style.left=rect.left+'px';
      dd.style.minWidth=rect.width+'px'; dd.style.display='block';
      renderVdd(i);
    };
    function renderVdd(i){
      var c=_conditions[i], vals=fieldVals(c.field), dd=document.getElementById('flt-vdd');
      if(!vals.length){ dd.innerHTML='<div class="flt-vdd-item" style="color:var(--text-muted)">No options</div>'; return; }
      dd.innerHTML=vals.map(function(v){
        var sel=c.values.indexOf(v)!==-1;
        var chk=sel?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="flex-shrink:0;color:var(--primary)"><polyline points="20 6 9 17 4 12"/></svg>':'<span style="display:inline-block;width:12px;flex-shrink:0"></span>';
        var label=c.field==='Aspect'
          ?'<span class="aspect-chip" style="pointer-events:none">'+v+'</span>'
          :'<span>'+v+'</span>';
        return '<div class="flt-vdd-item'+(sel?' flt-selected':'')+'" onclick="pickFilterValue('+i+',\''+v.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')">'+chk+label+'</div>';
      }).join('');
    }
    window.pickFilterValue=function(i,v){
      var c=_conditions[i], vi=c.values.indexOf(v);
      if(vi===-1) c.values.push(v); else c.values.splice(vi,1);
      renderVdd(i); renderConds(); applyFilter();
    };
    function closeVdd(){ var d=document.getElementById('flt-vdd'); if(d) d.style.display='none'; _fltVddIdx=-1; }

    function renderConds(){
      var el=document.getElementById('flt-conditions'); if(!el) return;
      var addBtn=document.querySelector('.flt-add-btn');
      if(!_conditions.length){
        el.innerHTML='<div style="font-family:var(--font-body);font-size:12px;color:var(--text-muted);padding:4px 0;">No conditions. Click Add Condition to filter.</div>';
        if(addBtn) addBtn.style.display=''; updateBadge(); return;
      }
      el.innerHTML=_conditions.map(function(c,i){
        var other=_conditions.filter(function(x,j){return j!==i;}).map(function(x){return x.field;});
        var opts=FIELDS.map(function(f){
          return '<option value="'+f+'"'+(c.field===f?' selected':'')+(other.indexOf(f)!==-1?' disabled':'')+'>'+f+'</option>';
        }).join('');
        var type=FIELD_TYPES[c.field], valHtml='';
        if(type==='multi'){
          var lbl=c.values.length
            ? c.values.map(function(v){
                if(c.field==='Aspect') return '<span class="aspect-chip" style="pointer-events:none;font-size:10px">'+v+'</span>';
                return '<span style="color:var(--text-body);font-size:12px;font-family:var(--font-body);white-space:nowrap">'+v+'</span>';
              }).join('')
            : '<span style="color:var(--text-muted)">Select…</span>';
          valHtml='<button class="flt-value-btn" onclick="openFilterVdd('+i+',event)"><span class="flt-value-btn-label">'+lbl+'</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0"><path d="M6 9l6 6 6-6"/></svg></button>';
        } else if(type==='number'){
          valHtml='<input type="number" class="flt-value-btn" min="0" placeholder="# programs" value="'+c.numVal+'" oninput="setConditionNum('+i+',this.value)" style="cursor:text;">';
        } else if(type==='date'){
          valHtml='<input type="date" class="flt-value-btn" value="'+c.dateVal+'" onchange="setConditionDate('+i+',this.value)" style="cursor:pointer;">';
        }
        return '<div class="flt-row"><select class="flt-field-sel" onchange="setConditionField('+i+',this.value)">'+opts+'</select>'+valHtml+'<button class="flt-del" onclick="removeFilterCondition('+i+')" title="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></button></div>';
      }).join('');
      if(addBtn) addBtn.style.display=_conditions.length>=FIELDS.length?'none':'';
      updateBadge();
    }

    // Search input integration
    var si=document.getElementById('reviewSearch');
    if(si){ si.removeAttribute('oninput'); si.addEventListener('input',applyFilter); }

    document.addEventListener('click',function(e){
      var m=document.getElementById('filter-modal'),b=document.getElementById('filter-btn'),d=document.getElementById('flt-vdd');
      if(m&&m.style.display!=='none'&&b&&!m.contains(e.target)&&!b.contains(e.target)&&!(d&&d.contains(e.target))) closeFilterModal();
      if(d&&d.style.display!=='none'&&!d.contains(e.target)) closeVdd();
    });
  })();
  </script>

  <!-- User Switcher -->
  <div id="user-switcher">

      <button class="sw-option" onclick="swSwitch('Admin')"><span class="sw-dot"></span>Admin</button>

      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span id="sw-label">Admin</span>

  <script>
    (function(){
      var KEY = 'idp-role';
      function cur(){ return localStorage.getItem(KEY) || 'Admin'; }
      function render(r){
        document.getElementById('sw-label').textContent = r;
        document.querySelectorAll('.sw-option').forEach(function(b){
          b.classList.toggle('sw-active', b.textContent.trim() === r);
        });

        localStorage.setItem(KEY, r);

  </script>

  <div class="bulk-bar" id="bulkBar">

      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

    </button>

      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>

  <script>
  /* ═══ Select All + Bulk bar ═══ */
  (function(){
    var bar = document.getElementById('bulkBar');
    var countEl = document.getElementById('bulkCount');
    var selectAllCb = document.getElementById('select-all-cb');

    function getRowCbs(){ return document.querySelectorAll('.review-table tbody .row-cb'); }

    function updateBar(){
      var rowCbs = getRowCbs();
      var checked = document.querySelectorAll('.review-table tbody .row-cb:checked').length;
      countEl.textContent = checked;
      bar.classList.toggle('visible', checked > 0);
      if(checked === 0) selectAllCb.checked = selectAllCb.indeterminate = false;
      else if(checked === rowCbs.length){ selectAllCb.checked = true; selectAllCb.indeterminate = false; }
      else { selectAllCb.indeterminate = true; selectAllCb.checked = false; }
    }

    selectAllCb.addEventListener('change', function(){
      var check = this.checked;
      getRowCbs().forEach(function(cb){ cb.checked = check; });
      this.indeterminate = false;
      updateBar();
    });

    document.querySelector('.review-table').addEventListener('change', function(e){
      if(e.target.classList.contains('row-cb') && e.target !== selectAllCb) updateBar();
    });
  })();

  /* ═══ Aspect multi-chip tooltip ═══ */
  (function(){
    var tip = document.createElement('div');
    tip.className = 'aspect-tip';
    tip.id = 'aspectTip';
    document.body.appendChild(tip);

    window.showAspectTip = function(el){
      var cell = el.closest('.aspect-cell');
      if(!cell) return;
      var aspects;
      try { aspects = JSON.parse(cell.dataset.aspects || '[]'); } catch(e){ aspects = []; }
      if(!aspects.length) return;
      tip.innerHTML = '<div class="aspect-tip-title">Aspects ('+aspects.length+')</div>' +
        aspects.map(function(a){ return '<div class="aspect-tip-item">'+a+'</div>'; }).join('');
      tip.classList.add('open');
      var r = el.getBoundingClientRect();
      var th = tip.offsetHeight, tw = tip.offsetWidth;
      var left = Math.max(4, Math.min(r.left, window.innerWidth - tw - 8));
      var top = (r.top - th - 8 < 0) ? r.bottom + 8 : r.top - th - 8;
      tip.style.left = left + 'px';
      tip.style.top = top + 'px';
    };
    window.hideAspectTip = function(){ tip.classList.remove('open'); };
  })();

      </div>

  <script>
  function openRejectModal() {
    document.getElementById('rejectReason').value = '';
    document.getElementById('rejectSubmitBtn').disabled = true;
    document.getElementById('rejectModal').classList.add('open');
  }
  function closeRejectModal() {
    document.getElementById('rejectModal').classList.remove('open');
  }
  function updateRejectBtn() {
    document.getElementById('rejectSubmitBtn').disabled =
      document.getElementById('rejectReason').value.trim().length === 0;
  }
  function submitReject() {
    closeRejectModal();
  }
  document.getElementById('rejectModal').addEventListener('click', function(e) {
    if (e.target === this) closeRejectModal();
  });

  <script>
  (function(){
    function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    function initials(n){ var p=(n||'').trim().split(/\s+/); return ((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase(); }
    function dmy(iso){ var a=(iso||'').split('-'); return a.length===3? a[2]+'/'+a[1]+'/'+a[0] : (iso||''); }
    var ACTIONS = '<td class="col-actions"><div class="action-buttons" style="justify-content:flex-end">'
      + '<button class="icon-btn icon-btn-view" data-tooltip="View Detail" onclick="window.location.href=\'detail-review-idp.html\'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="icon-tooltip">View Detail</span></button>'
      + '<button class="icon-btn icon-btn-reject" data-tooltip="Reject" onclick="openRejectModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span class="icon-tooltip">Reject</span></button>'
      + '<button class="icon-btn icon-btn-approve" data-tooltip="Approve"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span class="icon-tooltip">Approve</span></button>'
      + '</div></td>';
    function aspectCell(aspects){
      if(!aspects || !aspects.length) return '<td></td>';
      if(aspects.length===1) return '<td><span class="aspect-chip leadership">'+esc(aspects[0])+'</span></td>';
      return '<td><div class="aspect-cell" data-aspects=\''+esc(JSON.stringify(aspects))+'\'><span class="aspect-chip">'+esc(aspects[0])+'</span><span class="aspect-more" onmouseenter="showAspectTip(this)" onmouseleave="hideAspectTip()">+'+(aspects.length-1)+'</span></div></td>';
    }
    fetch('/data/idp-data.json').then(function(r){return r.json();}).then(function(d){
      var body=document.getElementById('review-tbody'); if(!body) return;
      body.innerHTML=(d.reviews||[]).map(function(rv){
        var rq=rv.reqby||{};
        return '<tr>'
          + '<td class="col-cb"><input type="checkbox" class="row-cb"></td>'
          + '<td class="col-reqby"><div class="emp-cell"><div class="emp-avatar" style="background:'+esc(rq.color||'#6366f1')+';">'+esc(initials(rq.name))+'</div><div><div class="reqby-name">'+esc(rq.name)+'</div><div class="emp-meta">'+esc(rq.role||'')+'</div></div></div></td>'
          + '<td><div class="pcp-cell" data-pcp-kind="Participant" data-people=\''+esc(JSON.stringify(rv.participants||[]))+'\' onmouseenter="showPcpTip(this)" onmouseleave="hidePcpTip()"></div></td>'
          + aspectCell(rv.aspects)
          + '<td><div class="pcp-cell" data-pcp-kind="PIC" data-people=\''+esc(JSON.stringify(rv.pics||[]))+'\' onmouseenter="showPcpTip(this)" onmouseleave="hidePcpTip()"></div></td>'
          + '<td><div class="sub-date" data-date="'+esc(rv.date)+'">'+esc(dmy(rv.date))+'</div></td>'
          + ACTIONS
          + '</tr>';
      }).join('');
      if(window.__renderPcp) window.__renderPcp();
    }).catch(function(e){ console.error('idp-data.json', e); });
  })();
  </script>
</body>
</html>
